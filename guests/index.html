<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>プレオープン ご招待中のみなさま</title>
<style>
  :root {
    --bg: #ffffff;
    --fg: #1a1a1a;
    --muted: #6b7077;
    --line: #e3e6ea;
    --yes: #1b7a3d;
    --yes-bg: #e6f4ea;
    --wait: #5f6670;
    --wait-bg: #f1f3f5;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #151618;
      --fg: #e9eaec;
      --muted: #9aa0a6;
      --line: #33363a;
      --yes: #6fd08c;
      --yes-bg: #14281b;
      --wait: #b4b9bf;
      --wait-bg: #24272b;
      color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font-family: "Hiragino Sans", "Yu Gothic", "Noto Sans JP", system-ui, sans-serif;
    font-size: 16px;
    line-height: 1.6;
    padding: max(20px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(32px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
  }
  main { max-width: 560px; margin: 0 auto; }
  h1 { font-size: 20px; margin: 0; }
  .sub { margin: 4px 0 0; font-size: 13px; color: var(--muted); }
  .count { margin: 14px 0 6px; font-size: 13px; color: var(--muted); }
  ul { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--line); }
  li { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 2px; border-bottom: 1px solid var(--line); }
  .name { font-weight: 700; min-width: 0; overflow-wrap: anywhere; }
  .tag { flex: 0 0 auto; font-size: 12px; font-weight: 700; padding: 2px 10px; border-radius: 999px; }
  .tag.yes { color: var(--yes); background: var(--yes-bg); }
  .tag.wait { color: var(--wait); background: var(--wait-bg); }
  .msg { color: var(--muted); font-size: 14px; padding: 12px 0; }
  .foot { margin-top: 18px; font-size: 12px; color: var(--muted); }
  .foot a { color: inherit; }
</style>
</head>
<body>
<main>
  <h1>プレオープン ご招待中のみなさま</h1>
  <p class="sub">博多中洲屋台村 なんしょっと？ 中野北口店<br>2026年11月30日（月）19:00〜22:00</p>
  <p class="count" id="count"></p>
  <ul id="list"></ul>
  <p class="msg" id="msg">読み込み中…</p>
  <p class="foot">「確定」はご参加が決まった方、「声かけ中」はお声がけしている方です。内容は随時更新されます。<br><a href="../reception/">プレオープンのご案内</a></p>
</main>
<script>
(() => {
  const API = "https://script.google.com/macros/s/AKfycbxLk3QHOygHaXucItleZTVCuahcIf8JOqXJ7HmAEaXprc1y3YolLEy4iiGyb8iYs3JU/exec?api=guests";
  const $ = (id) => document.getElementById(id);
  // 社内の呼び名 → 正式な活動名（様は表示時に付ける）。ここに無い人は呼び名のまま表示する
  const OFFICIAL = {
    "銀太": "GINTA",
    "ブチギレの坂本": "GGチャンネル サカモト",
    "ブチギレ宇治原": "ブチギレ氏原",
    "たけやき翔": "タケヤキ翔",
    "カマタク": "カマたく",
    "OOODA": "OooDa",
    "たっくーTV": "たっくー",
    "ハテニャン": "はてにゃん",
    "じんたん": "スカイピース ☆イニ☆（じん）",
    "妹尾": "妹尾ゆうか",
  };
  const display = (name) => `${OFFICIAL[name] || name}様`;

  // LINE内ブラウザ等でGoogleがJSONでなく中間ページを返すことがあるので、読み直して最大3回試す
  async function load() {
    let last;
    for (let i = 0; i < 3; i++) {
      try {
        const text = await (await fetch(API, { credentials: "omit" })).text();
        return JSON.parse(text);
      } catch (e) {
        last = e;
        await new Promise((r) => setTimeout(r, 1200));
      }
    }
    throw last;
  }

  load()
    .then((out) => {
      if (!out.ok) throw new Error(out.error || "");
      // 確定 → 声かけ中、同じ中は名前順
      const rank = (g) => (g.status === "確定" ? 0 : 1);
      const guests = out.data.slice().sort((a, b) => rank(a) - rank(b) || (OFFICIAL[a.name] || a.name).localeCompare(OFFICIAL[b.name] || b.name, "ja"));
      const list = $("list");
      for (const g of guests) {
        const li = document.createElement("li");
        const name = document.createElement("span");
        name.className = "name";
        name.textContent = display(g.name);
        const tag = document.createElement("span");
        tag.className = `tag ${g.status === "確定" ? "yes" : "wait"}`;
        tag.textContent = g.status;
        li.append(name, tag);
        list.appendChild(li);
      }
      const yes = guests.filter((g) => g.status === "確定").length;
      $("count").textContent = `確定 ${yes}名・声かけ中 ${guests.length - yes}名`;
      $("msg").hidden = guests.length > 0;
      $("msg").textContent = "まだ掲載できる方はいません。";
    })
    .catch(() => {
      $("msg").textContent = "読み込めませんでした。時間をおいて開き直してください。";
    });
})();
</script>
</body>
</html>
